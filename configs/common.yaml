# Shared protocol for all four models. Values marked PENDING are placeholders that
# the validation pilot (Phase F/G) must freeze before the main sweep; see docs/decisions.md.

task:
  dataset: rayleigh_benard          # never rayleigh_benard_uniform
  fields: [buoyancy, pressure, velocity_x, velocity_y]
  n_steps_input: 4
  n_steps_output: 1
  spatial_resolution: [512, 128]    # [x, y] as stored by The Well (x periodic, y walls)

paths:
  # $DATA_ROOT/datasets/rayleigh_benard/{stats.yaml,data/{train,valid,test}}
  data_root_env: DATA_ROOT
  output_root_env: OUTPUT_ROOT

data:
  normalization: zscore             # upstream stats.yaml, frozen for every subset (docs/decisions.md D4)
  subset_manifest: null             # set per task: tasks/subset_{10,30,100}.json

optim:
  name: adamw
  lr: 5.0e-4                        # PENDING: shared grid {1e-4, 5e-4, 1e-3} on validation
  weight_decay: 1.0e-4              # upstream configs/optimizer/adam.yaml
  betas: [0.9, 0.999]

schedule:
  name: time_cosine                 # warmup in steps, cosine over cumulative training seconds
  warmup_steps: 500                 # PENDING
  min_lr_ratio: 0.0

train:
  # The Well's rayleigh_benard data config (the paper's runs). Fits every model in fp32 on an A100 80 GB
  # (profile 2026-11-08, peak: CNextU-Net 58.7 GB, TFNO 44.9, AViT 7.4, ConvLSTM 23.6). Decisions D7.
  batch_size: 64
  loss: mse                         # one-step, full-state, normalized units, equal field weights
  precision: fp32                   # every model, as the paper (AMP off); TFNO cannot use bf16 (D8)
  grad_clip_norm: null              # upstream does not clip
  deterministic: false
  # Cumulative training-loop seconds (data loading + forward + backward + optimizer).
  # Labels name the checkpoints (checkpoint_1h.pt, ...); overrides replace this mapping whole.
  budgets_seconds:
    1h: 3600
    4h: 14400
  resume_every_seconds: 900         # wall seconds between last_resume.pt writes
  val_every_seconds: 1800           # training seconds between short validations
  val_windows: 64                   # fixed, evenly spaced validation windows
  log_every_steps: 50
  max_steps: null                   # testing hook; null in production

eval:
  rollout_steps: 30
  report_steps: [1, 3, 6, 12, 20, 30]
  rollout_starts: [20, 80, 140]     # PENDING: freeze from validation before reporting
  thresholds: [1.0, 2.0, 5.0]       # VRMSE failure thresholds; primary chosen on validation
  noise_sigmas: [0.0]               # core study: clean only; the noise extension uses experiments/noise.yaml
  noise_seed: 0
  one_step_window_stride: 1         # 1 = every window of every test trajectory
  spectra_steps: [1, 10, 30]
  batch_size: 16
  latency_warmup: 10
  latency_iters: 50

physics:
  # From the upstream dataset README; scripts/inspect_dataset.py must confirm on real data.
  Lx: 4.0
  Ly: 1.0
  b_bottom: 1.0                     # b(y=0) = Ly
  b_top: 0.0
  # The values are on Chebyshev-Gauss nodes, but the files' dimensions/y is a placeholder
  # linspace(0, 1, 128); gauss generates the real nodes (scripts/probe_y_grid.py, decisions D18).
  y_grid: gauss                     # auto (trust dimensions/y) | gauss | lobatto

sweep:
  seeds: [0, 1, 2]
  fractions: [0.1, 0.3, 1.0]

# Data-loading knobs: excluded from the config hash (config.config_hash), so changing them never changes a
# run's identity or blocks a resume. RBBENCH_NUM_WORKERS overrides num_workers per job (the Slurm scripts
# set it from the CPUs they request).
runtime:
  num_workers: 4
  prefetch_factor: 4                # batches each worker keeps ready
  pin_memory: true
