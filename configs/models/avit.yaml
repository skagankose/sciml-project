# The Well AViT (axial ViT, simplified from MPP). Patch size is hard-coded to 16 upstream.
# `full` matches the published Well config (hidden 384, 6 heads) with the default
# 8 processor blocks. 14,689,792 parameters at 512x128 (32x8 tokens).
# hidden_dim/4 must be divisible by 12 (GroupNorm groups in the stem).
full:
  hidden_dim: 384
  num_heads: 6
  processor_blocks: 8
  drop_path: 0.0
tiny:
  hidden_dim: 48
  num_heads: 2
  processor_blocks: 2
  drop_path: 0.0
