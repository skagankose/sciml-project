# The Well UNetConvNext (the_well.benchmark.models.UNetConvNext).
# `full` matches the published benchmark: init dim 42, 2 blocks/stage, 4 up/down stages,
# 1 bottleneck block, 7x7 depthwise kernels. 18,575,344 parameters at 512x128.
full:
  stages: 4
  blocks_per_stage: 2
  blocks_at_neck: 1
  init_features: 42
  gradient_checkpointing: false
tiny:
  stages: 4
  blocks_per_stage: 1
  blocks_at_neck: 1
  init_features: 8
  gradient_checkpointing: false
# Learning rate: The Well's own 5-rate sweep chose 5e-4 for UNetConvNext on rayleigh_benard (model card
# polymathic-ai/UNetConvNext-rayleigh_benard). Used so our runs can be compared with the paper (decisions D7).
train_overrides:
  optim:
    lr: 5.0e-4
