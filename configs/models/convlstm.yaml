# OpenSTL ConvLSTMCell (vendored verbatim) inside a thin encoder / 4-frame unroll / decoder.
# `full` follows OpenSTL's reference ConvLSTM config (configs/mmnist/ConvLSTM.py): 4 layers,
# 5x5 filters, stride 1, 4x4 space-to-depth patches, no layer norm; hidden width widened from
# 128 to 152 (cells, encoder, decoder) so parameter counts match across families:
# 18,788,784 parameters receive gradients (23,594,416 allocated; OpenSTL's cell allocates
# conv_o/conv_last that forward never uses). See docs/decisions.md D3.
# Hidden and cell states are zero-initialised inside every forward call.
full:
  patch_size: 4
  num_hidden: [152, 152, 152, 152]
  filter_size: 5
  encoder_channels: 152
  decoder_channels: 152
tiny:
  patch_size: 4
  num_hidden: [16, 16]
  filter_size: 3
  encoder_channels: 16
  decoder_channels: 16
